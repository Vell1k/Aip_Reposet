ЗАДАНИЕ 208(3)
Ответ: главная ось может быть направлена сверху вниз (значение column) или снизу вверх (значение column-reverse).

ЗАДАНИЕ 208(4)
Ответ: главная ось может быть направлена слева направо (значение row) или справа налево (значение row-reverse).

ЗАДАНИЕ 208(5)
Ответ: нет, поперечная ось может быть направлена только сверху вниз или слева направо.

ЗАДАНИЕ 208(6)
Ответ: нет, поперечная ось может быть направлена только сверху вниз или слева направо.

ЗАДАНИЕ 208(7)
Ответ: главная ось направлена слева направо, поперечная ось направлена сверху вниз.

ЗАДАНИЕ 208(8)
Ответ: главная ось направлена сверху вниз, поперечная ось направлена слева направо.

ЗАДАНИЕ 208(9)
Ответ: главная ось направлена справа налево, поперечная ось направлена сверху вниз.

ЗАДАНИЕ 208(10)
